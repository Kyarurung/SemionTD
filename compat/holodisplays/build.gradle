plugins {
    id 'net.fabricmc.fabric-loom'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.0'
}
group = 'local.semion.compat'
version = '0.5.1+26.3-local'
base { archivesName = 'holodisplays' }
repositories { mavenCentral(); maven { url 'https://maven.nucleoid.xyz' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    implementation 'net.fabricmc:fabric-language-kotlin:1.14.1+kotlin.2.4.20'
    implementation 'eu.pb4:placeholder-api:3.2.0+26.3'
    implementation include('eu.pb4:sgui:2.2.1+26.3')
    implementation include('me.lucko:fabric-permissions-api:0.7.0')
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
java { withSourcesJar() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
jar { from('LICENSE'); from('SOURCE_NOTICE.txt') }
