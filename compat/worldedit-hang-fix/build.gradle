plugins { id 'net.fabricmc.fabric-loom' }
group = 'local.semion.compat'
version = '1.0.5+26.3-local'
base { archivesName = 'worldedit-hang-fix' }
repositories { mavenCentral(); maven { url 'https://maven.nucleoid.xyz' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'

}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
java { withSourcesJar() }
processResources { exclude 'META-INF/**', 'pack.mcmeta'; inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
jar { from('LICENSE'); from('SOURCE_NOTICE.txt') }
