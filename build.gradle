plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    // Serves Polymer modules
    maven {
        url 'https://maven.nucleoid.xyz'
    }
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    maven {
        url "https://repo.biryeong.kim/releases/"
    }

    maven {
        url("https://maven.supersanta.me/snapshots")
    }

    maven {
        url("https://jitpack.io")
    }
    maven {
        url 'https://kneelawk.com/maven/'
        name 'Kneelawk Maven'
    }
    maven {
        url 'https://maven.resourcefulbees.com/repository/maven-public/'
        name 'Resourceful Bees Maven'
    }
    maven {
        // For LibNetworkStack, if using 'syncing' module
        url 'https://maven.alexiil.uk/'
        name 'AlexIIL Maven'
    }

//     Uncomment if using Rosemary or some other Modrinth dependency
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }

        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.3 is unobfuscated; no remapping or mappings dependency.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation('maven.modrinth:betterhud2:kPuLN1uu') {
        transitive = false
    }
    implementation 'net.fabricmc:fabric-language-kotlin:1.14.1+kotlin.2.4.20'
    compileOnly 'io.github.toxicity188:BetterHud-mod-api:2.0.0'

    // Polymer
    implementation("eu.pb4:polymer-core:${project.polymer_version}")
    implementation("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
    implementation("eu.pb4:polymer-resource-pack:${project.polymer_version}")
    implementation("eu.pb4:polymer-resource-pack-extras:${project.polymer_version}")
    implementation("eu.pb4:polymer-autohost:${project.polymer_version}")
    implementation("eu.pb4:polymer-blocks:${project.polymer_version}")

    // Server-Translations
    implementation include("xyz.nucleoid:server-translations-api:${project.server_translations_version}")
    implementation include("xyz.nucleoid:stimuli:${project.stimuli_version}")
    implementation include("de.tomalbrc:DialogUtils:${project.dialogutils_version}")
    implementation include("eu.pb4:sgui:${project.sgui_version}")

    implementation include("net.kyori:adventure-platform-fabric:${project.adventure_platform_version}")
    implementation "net.kyori:adventure-text-minimessage:${project.adventure_api_version}"
    implementation "net.kyori:adventure-api:${project.adventure_api_version}"


    implementation include("xyz.nucleoid:fantasy:${project.fantasy_version}")
    implementation include("xyz.nucleoid:map-templates:${project.map_templates}")
    implementation include("eu.pb4:sidebar-api:${project.sidebar_api_version}")
    implementation include("de.tomalbrc:avatar-renderer:${project.avatar_renderer_version}")
    implementation include("eu.pb4:map-canvas-api:${project.map_canvas_api_version}")
    implementation include("maven.modrinth:blockbench-import-library:${project.bli_version}")
    implementation include("eu.pb4:placeholder-api:${project.papi_version}")
    // BIL uses this API for its existing permission predicates.
    implementation include('me.lucko:fabric-permissions-api:0.7.0')

    implementation include(project(':compat-danta-shader'))
    implementation include("kim.biryeong:GCB-server:1.2.0+26.3")
    implementation include("eu.pb4:player-data-api:0.11.0+26.2")
    implementation("maven.modrinth:resourceful-lib:${project.resourceful_lib_version_id}") {
        transitive = false
    }
    implementation "eu.pb4:factorytools:${project.factorytools_version}"
    implementation "maven.modrinth:yacl:${project.yacl_version}"
    implementation include(project(':compat-friends-and-foes'))
    implementation "maven.modrinth:friends-and-foes-flowery-mooblooms-fabric:${project.flowery_mooblooms_version}"
    implementation include(project(':compat-friends-polymer'))
    implementation include(project(':compat-nightlights'))
    implementation include(project(':compat-nightlights-polymer'))
    // This upstream Polymer patch includes Flowery assets and every adult/baby variant.

localRuntime("maven.modrinth:carpet:26.3")

    implementation include("io.hypersistence:hypersistence-tsid:2.1.4")
    implementation include("org.xerial:sqlite-jdbc:3.46.1.0")

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
}

test {
    useJUnitPlatform()
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "semion-td-gametest"
        enableGameTests = true
        enableClientGameTests = true
        clearRunDirectory = false
        username = "SemionCapture"
        eula = true
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// Preserve the documented release command on unobfuscated Minecraft.
// Non-remapping Loom includes nested dependencies in the normal jar task.
tasks.register('remapJar') {
    group = 'build'
    description = 'Builds the distributable JAR for unobfuscated Minecraft 26.3.'
    dependsOn tasks.named('jar')
}
// A new run directory for every server-backed test invocation prevents accidental
// reuse or conversion of any prior developer/test/operating world.
def isolatedGameTestDirectory = layout.buildDirectory.dir('run/gameTest-26.3-' + java.util.UUID.randomUUID())
loom.runConfigs.named('gameTest') {
    runDirectory.set(isolatedGameTestDirectory)
}
tasks.named('runGameTest') {
    doFirst {
        File isolatedRun = isolatedGameTestDirectory.get().asFile
        if (new File(isolatedRun, 'world').exists()) {
            throw new GradleException('Refusing to reuse an existing GameTest world: ' + isolatedRun)
        }
        isolatedRun.mkdirs()
        new File(isolatedRun, 'server.properties').setText('', 'UTF-8')
        // Retain the explicitly accepted configureTests EULA setting for the new directory.
        new File(isolatedRun, 'eula.txt').setText('eula=true\n', 'UTF-8')
        layout.buildDirectory.file('26.3-gametest-run-dir.txt').get().asFile.setText(isolatedRun.absolutePath, 'UTF-8')
        logger.lifecycle('Isolated 26.3 GameTest directory: ' + isolatedRun)
    }
}


def capturePort = providers.gradleProperty('capturePort').getOrElse('25643')
def captureMode = providers.gradleProperty('captureMode').getOrElse('dialog')
def captureBetterHud = providers.gradleProperty('captureBetterHud').getOrElse('false').toBoolean()
def captureClientExcludedPrefixes = ['DialogUtils-', 'friends-and-foes-patch-']
def isolatedCaptureClientDirectory = layout.buildDirectory.dir('run/capture-client-' + java.util.UUID.randomUUID())
def isolatedCaptureServerDirectory = layout.buildDirectory.dir('run/capture-server-' + java.util.UUID.randomUUID())
loom.runConfigs.named('clientGameTest') {
    runDirectory.set(isolatedCaptureClientDirectory)
    systemProperties.put('semiontd.capture.port', capturePort)
    systemProperties.put('semiontd.capture.mode', captureMode)
    systemProperties.put('fabric.client.gametest.disableNetworkSynchronizer', 'true')
    programArguments.addAll('--width', '1600', '--height', captureMode == 'dialog' ? '1000' : '900')
}
loom.runConfigs.create('captureServer') {
    inherit(loom.runConfigs.getByName('server'))
    sourceSet.set('gametest')
    runDirectory.set(isolatedCaptureServerDirectory)
    systemProperties.put('semiontd.capture', 'true')
    systemProperties.put('semiontd.capture.mode', captureMode)
}
def prepareCaptureServer = {
        File isolatedRun = isolatedCaptureServerDirectory.get().asFile
        if (isolatedRun.exists()) throw new GradleException('Refusing to reuse capture server directory: ' + isolatedRun)
        isolatedRun.mkdirs()
        if (captureBetterHud) {
            File polymerConfig = new File(isolatedRun, 'config/polymer')
            polymerConfig.mkdirs()
            new File(polymerConfig, 'auto-host.json').setText('{"setup_early":false}\n', 'UTF-8')
        }
        new File(isolatedRun, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(isolatedRun, 'server.properties').setText(
                'server-ip=127.0.0.1\nserver-port=' + capturePort + '\nonline-mode=false\nmax-players=1\n' +
                'motd=Semion isolated capture\nlevel-name=capture-world\nview-distance=16\nsimulation-distance=5\n' +
                'spawn-protection=0\nwhite-list=false\n', 'UTF-8')
        layout.buildDirectory.file('26.3-capture-server-dir.txt').get().asFile.setText(isolatedRun.absolutePath, 'UTF-8')
        logger.lifecycle('Isolated capture server: ' + isolatedRun)
}
tasks.named('runCaptureServer') {
    if (!captureBetterHud) {
        classpath = files(classpath.files.findAll { !it.name.toLowerCase(java.util.Locale.ROOT).startsWith('betterhud') })
    }
    doFirst(prepareCaptureServer)
}
tasks.named('runClientGameTest') {
    dependsOn tasks.named('gametestClasses')
    classpath = files(classpath.files.findAll { file ->
        !captureClientExcludedPrefixes.any { prefix -> file.name.startsWith(prefix) }
    })
    if (!captureBetterHud) {
        classpath = files(classpath.files.findAll { !it.name.toLowerCase(java.util.Locale.ROOT).startsWith('betterhud') })
    }
    doFirst {
        layout.buildDirectory.file('26.3-capture-client-dir.txt').get().asFile.setText(
                isolatedCaptureClientDirectory.get().asFile.absolutePath, 'UTF-8')
        logger.lifecycle('Isolated capture client: ' + isolatedCaptureClientDirectory.get().asFile)
    }
}

tasks.register('prepareCaptureLaunch') {
    dependsOn {
        ['runCaptureServer', 'runClientGameTest'].collectMany { name ->
            def run = tasks.named(name).get()
            run.taskDependencies.getDependencies(run).toList()
        }
    }
    doLast {
        prepareCaptureServer()
        def launches = [:]
        ['runCaptureServer', 'runClientGameTest'].each { name ->
            def run = tasks.named(name).get()
            def arguments = new ArrayList(run.allJvmArgs)
            arguments.add(run.mainClass.get())
            arguments.addAll(run.args)
            run.argumentProviders.each { provider -> arguments.addAll(provider.asArguments()) }
            launches[name] = [args: arguments, workingDirectory: (name == 'runCaptureServer'
                    ? isolatedCaptureServerDirectory : isolatedCaptureClientDirectory).get().asFile.absolutePath]
        }
        def output = layout.buildDirectory.file('capture-launch.json').get().asFile
        output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launches)), 'UTF-8')
        layout.buildDirectory.file('capture-scope.json').get().asFile.setText(
                groovy.json.JsonOutput.toJson([mode: captureMode, betterHudRuntime: captureBetterHud,
                        clientExcludedJarPrefixes: captureClientExcludedPrefixes]), 'UTF-8')
        logger.lifecycle('Capture scope: mode=' + captureMode + ', BetterHud runtime=' + captureBetterHud)
        logger.lifecycle('Capture JVM launch descriptions: ' + output)
    }
}
